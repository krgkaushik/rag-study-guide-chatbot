
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Chatbot</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="bg-gray-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">Study Guide</h1>

        <span class="text-sm bg-blue-700 py-1 px-3 rounded-full">
            RAG Powered
        </span>
    </header>

    <!-- Chat Container -->
    <main
        id="chat-box"
        class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl mx-auto w-full"
    >
        <!-- AI Welcome Message -->
        <div class="flex justify-start">
            <div class="bg-white text-gray-800 rounded-lg p-3 max-w-[80%] shadow">
                Hello! I am trained on only 12 books. I can help you answer
                questions based on the content of those books. Please ask
                your question.
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white border-t p-4">
        <form
            id="chat-form"
            class="max-w-4xl mx-auto flex space-x-2"
        >
            <input
                type="text"
                id="message-input"
                autocomplete="off"
                required
                placeholder="Type your question..."
                class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >

            <button
                type="submit"
                id="send-btn"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors"
            >
                Send
            </button>
        </form>
    </footer>

    <!-- Custom JavaScript -->
    <script src="/static/js/script.js"></script>

</body>
</html>
